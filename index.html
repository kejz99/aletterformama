<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something I want to tell you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1230; --surface:#1b1f4b; --ink:#f4efff; --soft:#b9b6e0;
  --pink:#b9a7ff; --sun:#ffe9a8; --mint:#8fd3ff; --line:#2d3270; color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;line-height:1.6;overflow-x:hidden}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) translateX(var(--dx)) rotate(360deg);opacity:.2}}
main{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 24px 56px;text-align:center}
.wrap{width:100%;max-width:520px}
#stage{transition:opacity .4s,transform .4s;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage.out{opacity:0;transform:translateY(14px)}
h1{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(2.6rem,11vw,3.9rem);line-height:1.25;margin:.2em 0;font-weight:400}
h2{font-family:"Great Vibes","Brush Script MT",cursive;font-size:2.4rem;line-height:1.3;margin:.2em 0 .6em;font-weight:400}
p{margin:.5em 0;color:var(--soft)}
.sun{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 70% 30%,#f3e2a6 0 9px,transparent 10px),radial-gradient(circle at 25% 72%,#f3e2a6 0 12px,transparent 13px),var(--sun);box-shadow:0 0 44px 12px rgba(255,233,168,.35);margin:0 auto 22px;position:relative;animation:bob 3.4s ease-in-out infinite}
.sun::before,.sun::after{content:"";position:absolute;top:38px;width:9px;height:9px;border-radius:50%;background:#4a4a7a}
.sun::before{left:28px}.sun::after{right:28px}
.sun i{position:absolute;left:50%;top:56px;width:26px;height:13px;margin-left:-13px;border-bottom:4px solid #4a4a7a;border-radius:0 0 26px 26px}
.sun b{position:absolute;top:52px;width:14px;height:8px;border-radius:50%;background:#ffb3c9;opacity:.8}
.sun b:nth-child(1){left:10px}.sun b:nth-child(2){right:10px}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.btn{font:inherit;font-weight:500;border:0;cursor:pointer;padding:.65em 2em;border-radius:999px;background:var(--pink);color:#1a1740;transition:transform .2s,box-shadow .2s;margin:18px 8px 0}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 20px -8px var(--pink)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.bar{width:48px;height:5px;border-radius:5px;background:var(--mint);margin:18px auto}
.quote{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:44px 28px 36px;font-size:1.35rem;line-height:1.7;color:var(--ink);position:relative;width:100%}
.quote::before{content:"“";position:absolute;top:-4px;left:22px;font-size:4.5rem;line-height:1;color:var(--pink)}
.letter p{font-size:1.3rem;font-style:italic;font-weight:500;color:var(--ink);margin:.6em 0;line-height:1.5;opacity:0;animation:rise .9s forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.words{list-style:none;padding:0;margin:0;display:grid;gap:12px;text-align:left;width:100%}
.words li{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 20px 12px 62px;position:relative;color:var(--soft);font-size:1rem;transition:transform .25s}
.words li:hover{transform:translateX(6px)}
.words li::before{content:"";position:absolute;left:20px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:var(--c)}
.words li:nth-child(1){--c:var(--sun)}.words li:nth-child(2){--c:var(--pink)}.words li:nth-child(3){--c:var(--mint)}.words li:nth-child(4){--c:var(--sun)}
.words strong{display:block;color:var(--ink);font-size:1.15rem;font-weight:600}
.heart{font-size:3.6rem;display:inline-block;animation:beat 1.1s infinite}
@keyframes beat{30%{transform:scale(1.25)}60%{transform:scale(1)}}
.choices{position:relative;min-height:110px;width:100%}
.dots{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.dots span{width:10px;height:10px;border-radius:10px;background:var(--line);transition:all .3s}
.dots span.on{width:28px;background:var(--pink)}
.owner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 18px;font-size:.95rem;color:var(--ink);text-align:center;max-width:92vw}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.conf{position:fixed;top:-12px;width:10px;height:14px;pointer-events:none;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.letter p{opacity:1}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>
<main>
  <div class="wrap">
    <div id="stage" aria-live="polite"></div>
  </div>
</main>
<div class="dots" id="dots" aria-hidden="true"></div>

<script>
// ✏️ Put her name here, e.g. "Mia". Leave empty to skip it.
const HER_NAME = "";
// ✏️ Optional backup: your phone number (e.g. "+959123456789") or email. If set, a "Tell me" button appears after she says yes.
const MY_CONTACT = "kejz4717@gmail.com";

const hey = "Hey" + (HER_NAME ? ", " + HER_NAME : "");
const quotes = [
  "The stars are countless, yet my eyes keep choosing you.",
  "Your smile is petrichor to me: the first rain after a long dry day, and I can finally breathe.",
  "Some people are luminous without trying. You are one of them, and I noticed.",
  "Your laugh is my favorite kind of noise, small and bright and halcyon.",
  "Love needs no grand words. Wherever you are, I feel like I have come home.",
  "The world is vast, but the place I want to be is right beside you."
];
const words = [
  ["Effervescent", "the way you make an ordinary room bubble with light."],
  ["Mellifluous", "your voice, the sweetest sound in my whole day."],
  ["Halcyon", "how calm and peaceful time feels when I talk to you."],
  ["Ineffable", "the part of you I will never find the right words for."]
];

const steps = [];
steps.push({ html: `<div class="sun" aria-hidden="true"><b></b><b></b><i></i></div>
  <p>a little page, written under the moon</p>
  <h1>${hey}.<br>I have something to tell you.</h1>`, btn: "Continue" });
const feelings = [
  "You are my favorite hello and my hardest goodbye.",
  "The moon pulls the tides, and you pull my heart, gently and endlessly.",
  "I am enchanted by the way you simply exist: effortless, luminous, endlessly kind.",
  "With you, even silence sounds like a love song.",
  "This is limerence, and tenderness, and something sweeter than both: I am falling for you, softly and completely."
];
steps.push({ html: `<h2>What my heart wants you to know</h2><div class="letter">${feelings.map((t, i) => `<p style="animation-delay:${0.4 + i}s">${t}</p>`).join("")}</div>`, btn: "Continue" });
steps.push({ ask: true, html: `<span class="heart" aria-hidden="true">🌙</span>
  <h2>I like you. Truly, deeply, a lot.</h2>
  <p>I am not asking for anything big, I just wanted you to know.</p>
  <div class="bar"></div>
  <h2>Will you be my person?</h2>
  <div class="choices"><button class="btn" id="yes">Yes 🌙</button><button class="btn alt" id="no">Let me think</button></div>` });

const stage = document.getElementById("stage"), dots = document.getElementById("dots");
steps.forEach(() => dots.appendChild(document.createElement("span")));
let n = 0, dodges = 0;

function render(){
  const s = steps[n];
  stage.innerHTML = s.html + (s.btn ? `<button class="btn" id="go">${s.btn}</button>` : "");
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === n));
  const go = document.getElementById("go");
  if (go) { go.onclick = next; go.focus({preventScroll:true}); }
  if (s.ask) setupAsk();
}
function next(){
  stage.classList.add("out");
  setTimeout(() => { n++; render(); stage.classList.remove("out"); }, 400);
}

function setupAsk(){
  const no = document.getElementById("no"), yes = document.getElementById("yes");
  const box = no.parentElement;
  const dodge = () => {
    dodges++;
    const r = box.getBoundingClientRect();
    no.style.position = "absolute";
    no.style.left = Math.random() * Math.max(0, r.width - no.offsetWidth) + "px";
    no.style.top = Math.random() * 60 + "px";
  };
  no.addEventListener("mouseenter", dodge);
  no.addEventListener("touchstart", e => { e.preventDefault(); dodge(); }, {passive:false});
  no.addEventListener("click", dodge);
  yes.onclick = () => {
    stage.innerHTML = `<div class="pop"><span class="heart" aria-hidden="true">🎉</span>
      <h2>Thank you!</h2><p>I am the happiest I have ever been. I will never forget today.</p>${tellBtn()}</div>`;
    saveYes();
    dots.style.display = "none";
    const cols = ["#ffe9a8","#b9a7ff","#8fd3ff","#ffffff"];
    for (let k = 0; k < 90; k++) {
      const c = document.createElement("i");
      c.className = "conf"; c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[k % cols.length];
      c.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
      c.style.animationDelay = Math.random() * .8 + "s";
      document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
    }
  };
}

function tellBtn(){
  if (!MY_CONTACT) return "";
  const msg = encodeURIComponent("Yes 💛 I will be your person.");
  const href = MY_CONTACT.includes("@") ? `mailto:${MY_CONTACT}?subject=${encodeURIComponent("My answer 💛")}&body=${msg}` : `sms:${MY_CONTACT}?&body=${msg}`;
  return `<p style="margin-top:1.2em">One last thing: tap below so I hear it from you first.</p><a class="btn" href="${href}" style="display:inline-block;text-decoration:none">Tell me 💌</a>`;
}
async function saveYes(){
  try {
    const db = window.claude ? await claude.use("db") : null;
    if (db) await db.doc("answers/result").set({ answer: "yes", at: new Date().toISOString(), dodges });
  } catch (e) {}
}
// Only you (the owner) see this note when you open the page
(async () => {
  try {
    const u = window.claude ? await claude.use("user") : null;
    if (!u || !(await u.isOwner())) return;
    const db = await claude.use("db"); if (!db) return;
    const snap = await db.doc("answers/result").get();
    const b = document.createElement("div"); b.className = "owner";
    b.textContent = snap.exists ? "💛 She said YES! " + new Date(snap.data().at).toLocaleString() + " (tried to dodge " + snap.data().dodges + "x)" : "Owner view: no answer yet";
    document.body.appendChild(b);
  } catch (e) {}
})();

const petals = document.getElementById("petals"), shapes = ["✨","🌙","⭐","💫"];
setInterval(() => {
  const p = document.createElement("span");
  p.className = "petal"; p.textContent = shapes[Math.random() * shapes.length | 0];
  p.style.left = Math.random() * 100 + "vw";
  p.style.fontSize = 12 + Math.random() * 16 + "px";
  p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
  p.style.animationDuration = 8 + Math.random() * 8 + "s";
  petals.appendChild(p); setTimeout(() => p.remove(), 17000);
}, 900);

for (let k = 0; k < 55; k++) {
  const st = document.createElement("i"), z = 1 + Math.random() * 2.5;
  st.className = "star"; st.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;opacity:${.3+Math.random()*.6};animation-delay:${Math.random()*3}s`;
  petals.prepend(st);
}
render();
</script>
</body>
</html>
